version: "3.8"

services:
    # PostgreSQL 데이터베이스
    postgres:
        image: postgres:15-alpine
        container_name: tulog-postgres
        restart: unless-stopped
        env_file:
            - .env.docker
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./init.sql:/docker-entrypoint-initdb.d/init.sql
        networks:
            - tulog-network

    # NestJS API 서버
    api:
        build:
            context: ./api
            dockerfile: Dockerfile
        container_name: tulog-api
        restart: unless-stopped
        ports:
            - "8000:8000"
        environment:
            NODE_ENV: production
            DB_HOST: postgres
            DB_PORT: 5432
            DB_USERNAME: tulog
            DB_PASSWORD: star3840!
            DB_DATABASE: tulog
            DB_SCHEMA: server_api
            EMAIL_USER: ${EMAIL_USER}
            EMAIL_PASS: ${EMAIL_PASS}
            JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key}
            JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-jwt-refresh-secret-key}
        depends_on:
            - postgres
        volumes:
            - ./api/uploads:/app/uploads
        networks:
            - tulog-network

    # ML API (Python)
    ml-api:
        build:
            context: ./ml-api
            dockerfile: Dockerfile
        container_name: tulog-ml-api
        restart: unless-stopped
        ports:
            - "5000:5000"
        environment:
            DATABASE_URL: postgresql://tulog:star3840!@postgres:5432/tulog
        depends_on:
            - postgres
        networks:
            - tulog-network

volumes:
    postgres_data:

networks:
    tulog-network:
        driver: bridge
